name: Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened,reopened,synchronize]
  push:
    branches:
      - master

jobs:
  extension-stores:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The two maintained LTS lines; engines declares >=22.
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: extension-stores

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm run test
        env:
          tests: true

  extension-html:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The two maintained LTS lines; engines declares >=22.
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: extension-html

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm run test
        env:
          tests: true

  extension-typed-access:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The two maintained LTS lines; engines declares >=22.
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: extension-typed-access

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm run test
        env:
          tests: true

  Lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [extension-stores, extension-html, extension-typed-access]
    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      # Without `--fix`, which `npm run lint` passes: a finding fails the job.
      - name: Lint
        run: npx eslint .
